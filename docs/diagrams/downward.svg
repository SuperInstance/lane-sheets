  <line x1="362" y1="635" x2="653" y2="635" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 5"/>
  <path d="M665,622 l4,4 l7,-8" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="684" y="628" font-size="13">bind layer agrees byte-exact;</text>
  <path d="M667,640 v10" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>
  <circle cx="667" cy="655" r="1.7" fill="#b45309"/>
  <text x="684" y="647" font-size="13">run layer diverges in five named</text>
  <text x="684" y="666" font-size="13">places (BEHAVIOUR.md)</text>
