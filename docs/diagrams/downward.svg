    <rect x="284" y="738" width="20" height="20" rx="3" fill="#ffffff"/>
    <rect x="310" y="738" width="20" height="20" rx="3" fill="#ffffff"/>
    <rect x="336" y="738" width="20" height="20" rx="3" fill="#ffffff"/>
    <rect x="362" y="738" width="20" height="20" rx="3" fill="#dbeafe"/>
    <rect x="388" y="738" width="20" height="20" rx="3" fill="#ffffff"/>
    <rect x="414" y="738" width="20" height="20" rx="3" fill="#ffffff"/>
    <rect x="180" y="764" width="20" height="20" rx="3" fill="#ffffff"/>
    <rect x="206" y="764" width="20" height="20" rx="3" fill="#ffffff"/>
    <rect x="232" y="764" width="20" height="20" rx="3" fill="#dbeafe"/>
    <rect x="258" y="764" width="20" height="20" rx="3" fill="#ffffff"/>
    <rect x="284" y="764" width="20" height="20" rx="3" fill="#ffffff"/>
    <rect x="310" y="764" width="20" height="20" rx="3" fill="#dbeafe"/>
    <rect x="336" y="764" width="20" height="20" rx="3" fill="#2563eb"/>
    <rect x="362" y="764" width="20" height="20" rx="3" fill="#ffffff"/>
    <rect x="388" y="764" width="20" height="20" rx="3" fill="#dbeafe"/>
    <rect x="414" y="764" width="20" height="20" rx="3" fill="#ffffff"/>
  </g>

  <!-- amber tag on the bottom layer's right edge -->
  <rect x="640" y="717" width="200" height="30" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="1.3"/>
  <text x="740" y="736" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b45309">QUIL compiler: not built</text>

  <!-- downward steps -->
  <g stroke="#2563eb" stroke-width="2.4" fill="none">
    <path d="M350,216 V278" marker-end="url(#arr)"/>
    <path d="M350,410 V472" marker-end="url(#arr)"/>
    <path d="M350,604 V666" marker-end="url(#arr)"/>
  </g>

  <!-- side labels: what crosses, what does not -->
  <line x1="362" y1="247" x2="653" y2="247" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 5"/>
  <path d="M665,239 l4,4 l7,-8" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="684" y="245" font-size="13">clean numeric subset crosses;</text>
  <path d="M665,257 l7,7 m0,-7 l-7,7" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>
  <text x="684" y="264" font-size="13">text payloads refused by name</text>

  <line x1="362" y1="441" x2="653" y2="441" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 5"/>
  <path d="M667,431 v10" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>
  <circle cx="667" cy="446" r="1.7" fill="#b45309"/>
