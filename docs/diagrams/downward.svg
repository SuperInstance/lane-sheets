  <rect x="60" y="672" width="580" height="120" rx="10" fill="#ffffff" stroke="#1a1d21" stroke-width="1.6"/>
  <text x="80" y="698" font-size="13.5"><tspan font-weight="700" fill="#2563eb">04</tspan><tspan fill="#94a3b8"> · </tspan><tspan font-weight="700">quilt fabric</tspan></text>
  <g stroke="#94a3b8" stroke-width="1">
    <rect x="180" y="712" width="20" height="20" rx="3" fill="#ffffff"/>
    <rect x="206" y="712" width="20" height="20" rx="3" fill="#ffffff"/>
    <rect x="232" y="712" width="20" height="20" rx="3" fill="#dbeafe"/>
    <rect x="258" y="712" width="20" height="20" rx="3" fill="#ffffff"/>
    <rect x="284" y="712" width="20" height="20" rx="3" fill="#ffffff"/>
    <rect x="310" y="712" width="20" height="20" rx="3" fill="#dbeafe"/>
    <rect x="336" y="712" width="20" height="20" rx="3" fill="#ffffff"/>
    <rect x="362" y="712" width="20" height="20" rx="3" fill="#ffffff"/>
    <rect x="388" y="712" width="20" height="20" rx="3" fill="#ffffff"/>
    <rect x="414" y="712" width="20" height="20" rx="3" fill="#2563eb"/>
    <rect x="180" y="738" width="20" height="20" rx="3" fill="#dbeafe"/>
    <rect x="206" y="738" width="20" height="20" rx="3" fill="#ffffff"/>
    <rect x="232" y="738" width="20" height="20" rx="3" fill="#1a1d21"/>
